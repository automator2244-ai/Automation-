name = "ezpath-lead-proxy"
main = "index.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGIN = "https://ezpath-ai.com"

# 5 submissions per minute per IP. `period` must be exactly 10 or 60.
# `namespace_id` is any positive integer, unique within this Worker.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets are NOT set here. Run these once after the first deploy:
#   wrangler secret put MAKE_WEBHOOK_URL
#   wrangler secret put TURNSTILE_SECRET
